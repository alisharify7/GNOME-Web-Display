name: Checks and UI previews

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'aiohttp>=3.9,<4'
      - run: python -m compileall -q .
      - run: for script in install.sh setup.sh start.sh run.sh scripts/*.sh; do bash -n "$script"; done
      - run: python tools/manifest.py --check
      - run: bash scripts/verify.sh --source-only
      - run: python -m unittest discover -s tests -v
      - run: python tools/smoke_demo.py
      - run: python tools/smoke_installer.py

  ui-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/render_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: demo-ui-previews
          path: docs/images/*.png

# This workflow intentionally does not claim to test Mutter, real audio/video,
# physical mobile devices, Docker daemon access, or security isolation on a LAN.
